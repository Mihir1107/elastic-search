# Ledger relevance evaluation query set.
#
# category: exact-lookup | person-topic | date-scoped | conceptual | typo
# split:    tune | test -- alternating within each category. Tune settings on
#           `tune` only; report `test`. Tuning and reporting on one set overfits.
#
# `auto` attaches an objective grading rule, used where relevance is derivable
# from the document itself rather than a matter of opinion:
#   phrase  - the document must contain this phrase  -> 3, else 0
#   filter  - sender/recipient/date constraints      -> 3 if all match, else 0
#   both    - filter must match AND any term present -> 3; filter only -> 1; else 0
# Queries with no `auto` rule are conceptual and need human judgment; the
# labelling CLI pre-fills a heuristic suggestion for review.
version: 1
queries:

# ---------------------------------------------------------------- exact lookup
- {id: q01, category: exact-lookup, split: tune, query: '"rolling blackouts"', intent: Emails that literally discuss rolling blackouts., auto: {kind: phrase, phrase: rolling blackouts}}

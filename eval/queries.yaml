- {id: q07, category: exact-lookup, query: '"out of the office"', intent: Out-of-office notices., auto: {kind: phrase, phrase: out of the office}}
- {id: q08, category: exact-lookup, query: '"conference call"', intent: Arrangements for a conference call., auto: {kind: phrase, phrase: conference call}}

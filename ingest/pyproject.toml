[project]
name = "ledger-ingest"
version = "0.0.0"
description = "Ledger ingestion pipeline (download -> parse -> ... -> index)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "elasticsearch==9.5.1",
  "sentence-transformers==6.1.0",
  "typer==0.27.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]
